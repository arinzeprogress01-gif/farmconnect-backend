<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FarmConnect WebSocket Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #status {
            font-weight: bold;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
            margin-right: 10px;
        }

        #messages {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            min-height: 150px;
            background: #f8f8f8;
        }

        .message {
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <h1>FarmConnect WebSocket Test</h1>

    <p>
        Connection:
        <span id="status">Connecting...</span>
    </p>

    <button id="sendButton">
        Send Test Event
    </button>

    <div id="messages">
        <strong>Events:</strong>
    </div>


    <script src="/socket.io/socket.io.js"></script>
    <script src="/websocket-test.js"></script>

</body>

</html>
