services:
  farmconnect-api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    env_file:
      - .env

    restart: unless-stopped

    depends_on:
      - redis

    redis:
      image: redis:alpine
      restart: unless-stopped
      ports:
        - "6379:6379" 